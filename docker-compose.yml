services:
  sticky-memo:
    image: python-class-app:latest
    container_name: sticky_memo_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/sticky_notes.db
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
